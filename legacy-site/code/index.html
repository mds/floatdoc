<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FloatPrompt Format</title>
    <link rel="stylesheet" href="https://use.typekit.net/beg6tyg.css">
    <link rel="stylesheet" href="../styles.css">
    <script src="https://cdn.usefathom.com/script.js" data-site="BLXAEMDO" defer></script>
    <style>
        html {
            background-color: var(--card-4-color);
        }
        
        body {
            margin: 0;
            padding: 0;
            background: var(--card-4-color);
            min-height: 100vh;
            overflow-x: auto;
            margin: 0 auto;
        }

        .page-container {
            background: var(--card-4-color);
            min-height: 100vh;
            position: relative;
            overflow-y: auto;
        }
        
        .card-inner {
            padding: 0 0 2rem 0;
            height: 100vh;
            overflow: auto;
            background: var(--card-4-color);
            background-attachment: fixed;
            position: relative;
        }
        
        .toolbar-actions {
            padding: 2rem;
            background: linear-gradient(to bottom, var(--card-4-color) 75%, rgba(var(--card-4-rgb), 0) 100%);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            margin: 0 auto;
            z-index: 5;
            display: flex;
            justify-content: space-between;
            width: 100%;
            box-sizing: border-box;
            padding: 1rem 1rem 2rem 1rem !important;
        }
        
        .code-card {
            white-space: pre-wrap;
            margin-left: 2.5rem;
            margin-right: 2.5rem;
            margin-top: 5rem;
            display: block;
        }
        
        .header-title {
            display: none;
        }
        
        .right-buttons {
            display: flex;
            gap: 20px;
        }
        
        @media (max-width: 600px) {
            .toolbar-actions {
                padding: 1rem;
                flex-direction: column;
                align-items: flex-start;
                gap: 0.75rem;
            }
            
            .right-buttons {
                align-self: flex-start;
                justify-content: space-between;
                width: 100%;
                flex-shrink: 1;
                margin-left: 0 !important;
            }
            
            .code-card {
                margin-left: 2rem;
                margin-right: 2rem;
                margin-top: 6rem;
            }
            
            #selectBtn {
                display: none;
            }
        }
        
        .toolbar-actions .action-link:hover {
            color: var(--card-4-color);
        }

         .toolbar-actions .action-link:first-child {
            column-gap: .1rem;
        }
        
        ::selection {
            background: black;
            color: var(--card-4-color);
        }
        
        ::-moz-selection {
            background: black;
            color: var(--card-4-color);
        }

    </style>
</head>
<body>
    <div class="page-container">
                 <div class="toolbar-actions">
             <a href="/" class="action-link">←</a>
             <div class="right-buttons">
                 <a href="#" id="selectBtn" class="action-link">Select</a>
                 <a href="#" id="copyBtn" class="action-link">Copy</a>
                 <a href="#" id="downloadBtn" class="action-link">Download</a>
                 <a href="https://github.com/mds/floatprompt" target="_blank" rel="noopener noreferrer" class="action-link">GitHub</a>
             </div>
         </div>
         
         <code class="code-card" id="fpCode">
Loading floatprompt from GitHub...
</code>
    </div>

    <script>
        // Load FloatPrompt content from GitHub on page load
        async function loadFloatPromptContent() {
            const fpCodeElement = document.getElementById('fpCode');
            try {
                const response = await fetch('https://raw.githubusercontent.com/mds/floatprompt/main/templates/float-os.md');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                const text = await response.text();
                fpCodeElement.textContent = text;
            } catch (error) {
                console.error('Failed to load FloatPrompt content:', error);
                fpCodeElement.textContent = 'Error loading FloatPrompt format from GitHub. Please try refreshing the page.';
            }
        }

        // Load content when page loads
        document.addEventListener('DOMContentLoaded', loadFloatPromptContent);

        document.getElementById('copyBtn').addEventListener('click', async () => {
            try {
                // Fetch from GitHub source
                const response = await fetch('https://raw.githubusercontent.com/mds/floatprompt/main/templates/float-os.md');
                const text = await response.text();
                await navigator.clipboard.writeText(text);
                const btn = document.getElementById('copyBtn');
                const originalText = btn.textContent;
                btn.textContent = 'Copied!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            } catch (err) {
                console.error('Failed to copy: ', err);
                // Fallback to static content if GitHub fetch fails
                const text = document.getElementById('fpCode').textContent;
                try {
                    await navigator.clipboard.writeText(text);
                    const btn = document.getElementById('copyBtn');
                    const originalText = btn.textContent;
                    btn.textContent = 'Copied!';
                    setTimeout(() => {
                        btn.textContent = originalText;
                    }, 2000);
                } catch (fallbackErr) {
                    console.error('Fallback copy also failed: ', fallbackErr);
                }
            }
        });
        document.getElementById('downloadBtn').addEventListener('click', async () => {
            try {
                // Fetch from GitHub source
                const response = await fetch('https://raw.githubusercontent.com/mds/floatprompt/main/templates/float-os.md');
                const text = await response.text();
                const blob = new Blob([text], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'float-os.md';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (err) {
                console.error('Failed to fetch for download: ', err);
                // Fallback to static content
                const text = document.getElementById('fpCode').textContent;
                const blob = new Blob([text], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'float-os.md';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        });
        document.getElementById('selectBtn').addEventListener('click', () => {
            const codeElement = document.getElementById('fpCode');
            const btn = document.getElementById('selectBtn');
            try {
                const range = document.createRange();
                range.selectNodeContents(codeElement);
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                if (selection.toString().length > 0) {
                    const originalText = btn.textContent;
                    btn.textContent = 'Selected!';
                    setTimeout(() => {
                        btn.textContent = originalText;
                    }, 1500);
                } else {
                    throw new Error('Selection failed');
                }
            } catch (error) {
                codeElement.focus();
                codeElement.setAttribute('tabindex', '0');
                const originalText = btn.textContent;
                btn.textContent = 'Tap & Hold';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            }
        });
    </script>
    <script src="../assets/js/floatprompt.js"></script>
</body>
</html>
